[pytest]
# The browser tests need Chromium and a live server, so they are opt-in. Keeping
# them out of the default run preserves the property that `pytest -q` works on a
# fresh clone with nothing but `pip install -r requirements-dev.txt`.
#
#   pytest              -> the 299 unit and API tests
#   pytest -m e2e       -> the browser tests
addopts = -m "not e2e"
markers =
    e2e: needs a real browser and a running server (see tests/e2e/)
