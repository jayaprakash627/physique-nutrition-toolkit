# Render Blueprint — a written-down copy of how this service is actually set up.
#
# HEADS UP: the live service at physique-nutrition-toolkit.onrender.com was
# created by hand in the Render dashboard, and Render does NOT read this file for
# dashboard-created services. Editing it changes nothing on its own. It exists so
# the configuration isn't trapped in a web form:
#
#   * if the free service is ever suspended or deleted, New + → Blueprint → this
#     repo rebuilds it correctly in one step instead of nine failed deploys
#   * it documents WHY the settings are what they are, which a form can't
#
# If you change a setting in the dashboard, change it here too, or this drifts
# into a lie.
#
# This container's disk is still ephemeral — that never changes on the free plan.
# It no longer matters, because client data lives in Neon rather than in a file
# next to the app. What the free plan still costs you is a cold start: the
# instance sleeps after ~15 minutes idle and the next request waits 50+ seconds.

services:
  - type: web
    name: physique-nutrition-toolkit
    runtime: python
    plan: free
    region: singapore          # closest Render region to India

    branch: main
    # Root Directory is deliberately unset, i.e. the repo root. That is why
    # requirements.txt must stay at the root — the build command below is
    # resolved from there.
    buildCommand: pip install -r requirements.txt

    # uvicorn defaults to a single worker, and that default is load-bearing here:
    # sessions live in a module-level dict in app/security.py, so a second worker
    # would log the coach out at random as requests bounce between processes.
    # Stated explicitly so nobody "optimises" it by adding --workers 4.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    # Not set on the live service yet. Worth setting: /api/health also reports
    # whether Coach mode is locked, so a broken deploy and an unlocked deploy
    # both surface in the same place.
    healthCheckPath: /api/health

    envVars:
      # Both are set by hand in the dashboard and deliberately not stored here.
      # sync: false means "this service has a value; don't expect it in the repo"
      # — a database URL contains a password and a session password is a
      # password, and neither belongs in version control.
      #
      # Without COACH_PASSWORD, client endpoints return 503 by design rather
      # than running open.
      - key: COACH_PASSWORD
        sync: false

      # Without DATABASE_URL the app silently falls back to SQLite on this
      # container's ephemeral disk, and every client is erased on the next
      # redeploy. /api/health reports "db_durable": false when that has
      # happened — check it after any deploy that touched configuration.
      - key: DATABASE_URL
        sync: false

    # No disk block, and none is needed. Client data lives in Neon (managed
    # Postgres, free tier), which is what makes the free plan safe to keep: a
    # mounted disk would require a paid instance, and the ephemeral disk this
    # container does have now holds nothing that matters.
